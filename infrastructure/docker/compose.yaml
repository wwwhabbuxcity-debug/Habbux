name: habbux-local
services:
  postgres:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    profiles: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local password required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Local port required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
  redis:
    image: redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    profiles: [cache]
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 32mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:${REDIS_PORT:?Local port required}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    cpus: 0.25
  migrations:
    image: flyway/flyway:11.20.3@sha256:01605f443e1a891b3762f66e66d92403c33b6e0c29099ad550af94b6c1cbc3c1
    profiles: [tools]
    command: [validate]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Local database required}
      FLYWAY_USER: ${POSTGRES_USER:?Local user required}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Local password required}
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../../database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
volumes:
  postgres_data:
