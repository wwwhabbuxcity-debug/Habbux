# Fase temporária de emissão ACME. Não serve o repositório.
server {
    listen 80;
    listen [::]:80;
    server_name tyvo.online www.tyvo.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tyvo.online/.deploy/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
