# Vhost exclusivo do bootstrap Habbux. Nunca servir a raiz do repositório.
server {
    listen 80;
    listen [::]:80;
    server_name tyvo.online www.tyvo.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tyvo.online/.deploy/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://tyvo.online$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tyvo.online;

    ssl_certificate /etc/letsencrypt/live/tyvo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyvo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TyvoSSL:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/tyvo.online/.deploy/current;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log /var/log/nginx/tyvo.online.access.log;
    error_log /var/log/nginx/tyvo.online.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control no-cache always;

    location = /client { return 301 /client/; }
    location = /game { return 301 /game/; }
    location = /auth { return 301 /auth/; }
    location = /auth/ { try_files /index.html =404; }
    location = /game/ { try_files /client/index.html =404; }
    location = /game/dev { return 302 /client/?dev=1; }
    location = /admin {
        auth_basic "Habbux Administração";
        auth_basic_user_file /etc/nginx/.htpasswd_habbux_admin;
        return 301 /admin/;
    }
    location ^~ /admin-api/ {
        auth_basic "Habbux Administração";
        auth_basic_user_file /etc/nginx/.htpasswd_habbux_admin;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }
    location ^~ /login-theme/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }
    location ~ "^/login-theme-assets/(?<theme_asset>[a-f0-9-]{36}\\.(?:png|jpg))$" {
        alias /var/lib/habbux-tyvo/login-theme-assets/$theme_asset;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /admin/ {
        auth_basic "Habbux Administração";
        auth_basic_user_file /etc/nginx/.htpasswd_habbux_admin;
        try_files $uri $uri/ /admin/index.html =404;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:3100/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
